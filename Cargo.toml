[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nostr = { version = "=0.45.0-alpha.3", features = ["std", "nip44", "nip59", "os-rng"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "json"] }
tungstenite = { version = "0.28", features = ["native-tls"] }
base64 = "0.22"
