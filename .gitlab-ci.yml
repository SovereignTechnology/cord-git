# cord-git CI. Every job runs in a fresh Kata VM on ubuntu-server (Debian
# bookworm, the image's Rust toolchain). Nothing is cached between jobs and
# there are no CI/CD variables or secrets.
#
# Runners:
#   ci-grasp       not protected: merge requests.
#   ci-grasp-prot  protected refs only, run_untagged=false: main and
#                  sovtech-v* tags, which build the release binaries.
#
# Routing comes from ref protection alone (see sovtech/grasp-p's
# .gitlab-ci.yml; the runbook is kata/ci-grasp/README.md in sovtech/platform).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        GRASP_RUNNER_TAG: grasp-prot
    - if: $CI_COMMIT_TAG =~ /^sovtech-v/ && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        GRASP_RUNNER_TAG: grasp-prot
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_PROTECTED != "true"
      variables:
        GRASP_RUNNER_TAG: grasp
    - when: never

default:
  tags: [$GRASP_RUNNER_TAG]
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure]
  before_script:
    - rustc --version && cargo --version && git --version

variables:
  GIT_STRATEGY: clone
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "8"

stages:
  - lint
  - test
  - e2e
  - release

lint:
  stage: lint
  timeout: 30m
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings

test:
  stage: test
  needs: []
  timeout: 45m
  script:
    - cargo test --workspace --locked

# The full scenario suite against a real server: the pinned commit of
# sovtech/grasp-p, cloned with the job token (project 12 lists this project in
# its job-token allowlist) and built here.
e2e:
  stage: e2e
  needs: []
  timeout: 2h
  script:
    - ref=$(cat ci/SERVER_REF)
    - echo "$ref" | grep -qE '^[0-9a-f]{40}$'
    - git clone -q "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/gitlab/sovtech/grasp-p.git" /tmp/grasp-p
    - git -C /tmp/grasp-p -c advice.detachedHead=false checkout -q "$ref"
    - test "$(git -C /tmp/grasp-p rev-parse HEAD)" = "$ref"
    - (cd /tmp/grasp-p && cargo build --release --locked --bin ngit-grasp)
    - cargo build --release --locked
    - export SERVER_BIN=/tmp/grasp-p/target/release/ngit-grasp
    - export CORD_BIN="$CI_PROJECT_DIR/target/release/cord-git"
    - export INBOX_BIN="$CI_PROJECT_DIR/target/release/inbox-relay"
    - bash scripts/e2e.sh

release:
  stage: release
  timeout: 45m
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - cargo build --release --locked -p cord-git
    - mkdir -p ci-out
    - cp target/release/cord-git ci-out/
    - (cd ci-out && sha256sum cord-git > SHA256SUMS && cat SHA256SUMS)
    - ldd --version | head -n1 > ci-out/BUILD-INFO
    - rustc --version >> ci-out/BUILD-INFO
    - git rev-parse HEAD >> ci-out/BUILD-INFO
  artifacts:
    expire_in: 90 days
    paths:
      - ci-out/
