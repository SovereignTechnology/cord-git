# cord-git CI. Every job runs in a fresh Kata VM on ubuntu-server (Debian
# bookworm, the image's Rust toolchain). Nothing is cached between jobs and
# there are no CI/CD variables or secrets. The end-to-end job builds its own
# git (see .server-git).
#
# Runners:
#   ci-grasp       not protected: merge requests.
#   ci-grasp-prot  protected refs only, run_untagged=false: main and
#                  sovtech-v* tags, which build the release binaries.
#
# Routing comes from ref protection alone (see sovtech/grasp-p's
# .gitlab-ci.yml; the runbook is kata/ci-grasp/README.md in sovtech/platform).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        GRASP_RUNNER_TAG: grasp-prot
    - if: $CI_COMMIT_TAG =~ /^sovtech-v/ && $CI_COMMIT_REF_PROTECTED == "true"
      variables:
        GRASP_RUNNER_TAG: grasp-prot
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_PROTECTED != "true"
      variables:
        GRASP_RUNNER_TAG: grasp
    - when: never

default:
  tags: [$GRASP_RUNNER_TAG]
  # The host's memory governor may stop a CI VM; GitLab records that as
  # runner_interrupted. Retry requeues it. Script failures are never retried.
  retry:
    max: 2
    when: [runner_system_failure, runner_interrupted, stuck_or_timeout_failure]
  before_script:
    - rustc --version && cargo --version && git --version

variables:
  GIT_STRATEGY: clone
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "8"

stages:
  - lint
  - test
  - e2e
  - release

# Git for the job that RUNS the server. ngit-grasp shells out to git and needs
# 2.42 or newer since v3.0.6; the runner image has bookworm's 2.39.5 and Debian
# has never backported git to bookworm. So the end-to-end job builds the version
# Debian 13 ships from kernel.org's tarball, pinned by sha256, into /usr/local
# (ahead of /usr/bin on PATH), exactly as sovtech/grasp-p's test job does. Keep
# the two blocks identical. lint, test and release use the image's git: the
# client only calls rev-list, pack-objects and unpack-objects.
.server-git:
  before_script:
    - rustc --version && cargo --version
    - |
      git_v=2.47.3
      git_sha=9c2eb1250781b3e5bfef098572d07fdf132d67e6c065e4307332ade9819a1501
      export DEBIAN_FRONTEND=noninteractive
      apt-get -q -o Acquire::Retries=3 update
      apt-get -q -y --no-install-recommends install libcurl4-gnutls-dev
      b=$(mktemp -d)
      curl -fsSL --retry 3 --max-time 300 -o "$b/git.tar.xz" "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$git_v.tar.xz"
      echo "$git_sha  $b/git.tar.xz" | sha256sum --strict --quiet -c -
      tar -C "$b" -xJf "$b/git.tar.xz"
      make -s -C "$b/git-$git_v" -j8 prefix=/usr/local CFLAGS=-O2 NO_GETTEXT=1 NO_TCLTK=1 NO_PERL=1 NO_PYTHON=1 NO_EXPAT=1 install > "$b/make.log" 2>&1 || { tail -n 60 "$b/make.log" >&2; exit 1; }
      rm -rf "$b"; hash -r
    # The server under test must find the git a production guest gives it.
    - |
      v=$(git --version); v=${v#git version }
      [ "$(command -v git)" = /usr/local/bin/git ] || { echo "git on PATH is $(command -v git), not the one just built" >&2; exit 1; }
      dpkg --compare-versions "$v" ge 2.42 || { echo "git $v: the server needs 2.42 or newer" >&2; exit 1; }
      echo "git $v at /usr/local/bin/git"

lint:
  stage: lint
  timeout: 30m
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings

test:
  stage: test
  needs: []
  timeout: 45m
  script:
    - cargo test --workspace --locked

# The full scenario suite against a real server: the pinned commit of
# sovtech/grasp-p, cloned with the job token (project 12 lists this project in
# its job-token allowlist) and built here.
e2e:
  extends: .server-git
  stage: e2e
  needs: []
  timeout: 2h
  script:
    - ref=$(cat ci/SERVER_REF)
    - echo "$ref" | grep -qE '^[0-9a-f]{40}$'
    - git clone -q "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/gitlab/sovtech/grasp-p.git" /tmp/grasp-p
    - git -C /tmp/grasp-p -c advice.detachedHead=false checkout -q "$ref"
    - test "$(git -C /tmp/grasp-p rev-parse HEAD)" = "$ref"
    # On protected refs this job runs beside the protected runner's token, so the server
    # commit it builds must itself be on a protected branch of sovtech/grasp-p.
    - |
      if [ "$CI_COMMIT_REF_PROTECTED" = "true" ]; then
        branches=$(git -C /tmp/grasp-p branch -r --contains "$ref")
        grep -qxE ' *origin/(main|legacy/v1\.2-grasp-p)' <<<"$branches" ||
          { echo "ci/SERVER_REF $ref is on no protected branch of sovtech/grasp-p" >&2; exit 1; }
      fi
    - (cd /tmp/grasp-p && cargo build --release --locked --bin ngit-grasp)
    - cargo build --release --locked
    - export SERVER_BIN=/tmp/grasp-p/target/release/ngit-grasp
    - export CORD_BIN="$CI_PROJECT_DIR/target/release/cord-git"
    - export INBOX_BIN="$CI_PROJECT_DIR/target/release/inbox-relay"
    - bash scripts/e2e.sh

release:
  stage: release
  timeout: 45m
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - cargo build --release --locked -p cord-git
    - mkdir -p ci-out
    - cp target/release/cord-git ci-out/
    - (cd ci-out && sha256sum cord-git > SHA256SUMS && cat SHA256SUMS)
    # Not "ldd --version | head -n1": under pipefail ldd dies of SIGPIPE at random.
    - echo "glibc $(getconf GNU_LIBC_VERSION)" > ci-out/BUILD-INFO
    - rustc --version >> ci-out/BUILD-INFO
    - git rev-parse HEAD >> ci-out/BUILD-INFO
  artifacts:
    expire_in: 90 days
    paths:
      - ci-out/
